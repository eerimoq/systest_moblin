[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "systest_moblin"
version = "1.1.0"
description = "Shared systest utilities for Moblin system tests."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Erik Moqvist", email = "erik.moqvist@gmail.com" }]
keywords = ["test", "system", "moblin", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = ["systest"]

[project.urls]
Homepage = "https://github.com/eerimoq/systest_moblin"

[tool.setuptools.packages.find]
include = ["systest_moblin*"]

[tool.setuptools.package-data]
systest_moblin = ["py.typed"]
